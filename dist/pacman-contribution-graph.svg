<svg xmlns="http://www.w3.org/2000/svg" width="960" height="150" viewBox="0 0 960 150" role="img" aria-labelledby="title desc">
  <title id="title">Aguardando a primeira atualização das contribuições</title>
  <desc id="desc">Ilustração provisória. O workflow do GitHub substituirá esta imagem pelo Pac-Man animado com suas contribuições reais.</desc>
  <rect x="1" y="1" width="958" height="148" rx="8" fill="#ffffff" stroke="#058218"/>
  <path d="M112 55A28 28 0 1 0 112 95L88 75Z" fill="#07ba22"/>
  <g fill="#058218"><circle cx="139" cy="75" r="4"/><circle cx="162" cy="75" r="4"/><circle cx="185" cy="75" r="4"/></g>
  <text x="228" y="69" fill="#17251a" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Um commit de cada vez.</text>
  <text x="228" y="100" fill="#435548" font-family="Arial, Helvetica, sans-serif" font-size="17">Suas contribuições entram em cena após a primeira atualização.</text>
</svg>
